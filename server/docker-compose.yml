services:
  db:
    image: pgvector/pgvector:pg16        # Postgres 16 + pgvector extension pehle se installed
    container_name: rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rag_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the container, the database host is "db" rather than localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-change_me_local_password}@db:5432/${POSTGRES_DB:-ragdb}
      FASTEMBED_CACHE_PATH: /code/.cache/fastembed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - model_cache:/code/.cache/fastembed   # embedding model dobara download na ho

volumes:
  pgdata:
  model_cache: